<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Teste seus conhecimentos sobre a Monarquia Romana com um quiz de perguntas e pontuação.">
    <meta name="theme-color" content="#5b4388">
    <title>Quiz Monarquia Romana</title>
    <link rel="stylesheet" href="styles/quiz.css">
    <script src="script.js" defer></script>
    <script src="quiz.js" defer></script>
</head>

<body class="quiz-page">
    <a class="skip-link" href="#quiz-main">Pular para o quiz</a>

    <header>
        <div class="header-inner">
            <a class="brand" href="index.html" aria-label="Voltar para Monarquia Romana">
                
                <span>Monarquia Romana</span>
            </a>
            
            <div class="main-nav">
                <section class="quiz-dashboard" aria-label="Progresso do quiz">
                    <div class="pontuacao-card" aria-live="polite">
                        <span class="pontuacao-label">Acertos: </span>
                        <p><strong id="pontuacaoValue">0</strong> <span class="pontuacao-total"><strong>/ 8</strong></span></p>
                        
                    </div>
                </section>
                
            </div>

            <div class="header-actions">
                <a class="back-link" href="index.html">Voltar ao resumo</a>
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Ativar modo escuro" aria-pressed="false">
                    <span class="theme-label">Modo escuro</span>
                </button>
            </div>
        </div>
    </header>

    <main id="quiz-main" class="quiz-main section-shell">

        <section class="quiz-page-intro" aria-labelledby="quiz-title">
            <h1 id="quiz-title">Quiz</h1>
            <p>São 8 perguntas sobre a origem de Roma, as instituições políticas, a sociedade e os reis. Escolha uma alternativa por questão e leia a explicação após responder.</p>
        </section>


        <div class="quiz-list" id="quizList"></div>

        
    </main>

</body>

</html>
